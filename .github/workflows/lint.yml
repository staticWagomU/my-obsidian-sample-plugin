name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]

        steps:
            - uses: actions/checkout@v4

            # 匿名モード（bot-id なし）: 悪意あるパッケージのブロックのみ有効。
            # 長期シークレットは不要。組織単位の追跡が必要になったら
            # permissions に id-token: write を足し、with: bot-id を渡す。
            - uses: flatt-security/setup-takumi-guard-npm@v1

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - run: pnpm install
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run test:run

